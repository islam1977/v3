name: Signal tracker tests

on:
  pull_request:
    branches: [main]
    paths:
      - "signal_tracker_24h.py"
      - "tests/test_signal_tracker_24h.py"
      - ".github/workflows/signal-tracker-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependency
        run: python -m pip install requests
      - name: Run isolated tracker tests
        run: python -m unittest discover -s tests -p "test_signal_tracker_24h.py" -v
