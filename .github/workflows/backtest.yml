name: Backtest 5m (الخطوة 2)

# تشغيل يدوي فقط: Actions -> Backtest 5m -> Run workflow
# مابيعملش commit ولا push (عشان ما يتعارضش مع push بتاع الماسح).
# النتيجة بتظهر في صفحة التشغيل (Summary) + Artifact فيه الملفات التفصيلية.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "عدد الأيام"
        default: "90"
      symbols:
        description: "عدد العملات (الأعلى سيولة من قائمة الحلال)"
        default: "100"
      lag:
        description: "عدد شموع 5m بين الإشارة والدخول (2 ≈ تأخير cron+GitHub+تنفيذك)"
        default: "2"
      fee_pct:
        description: "رسوم ذهاب+إياب %"
        default: "0.2"
      slip_pct:
        description: "انزلاق إضافي عند الخروج بالـ stop %"
        default: "0.1"

concurrency:
  group: backtest-5m
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (آخر نسخة بس)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # كاش للشموع: التشغيلة التانية بتكمّل من آخر شمعة بدل ما تنزّل كل حاجة من الأول
      - name: Restore klines cache
        uses: actions/cache@v4
        with:
          path: bt_cache.pkl
          key: bt-klines-${{ github.run_id }}
          restore-keys: |
            bt-klines-

      - name: Run backtest
        run: |
          python backtest_5m.py \
            --days "${{ inputs.days || '90' }}" \
            --symbols "${{ inputs.symbols || '100' }}" \
            --lag "${{ inputs.lag || '2' }}" \
            --fee "${{ inputs.fee_pct || '0.2' }}" \
            --slip "${{ inputs.slip_pct || '0.1' }}" \
            --cache bt_cache.pkl

      - name: Show report in run summary
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat bt_out/bt_report.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no report" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: bt_out/
